name: DevxyzCrate v0.4 Rebuild APK

on:
  push:
    branches: [ rebuild/devxyzcrate-v04 ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct v0.4 source
        shell: bash
        run: |
          cat .bootstrap_v04/chunk_*.b64 > DevxyzCrate-v04.b64
          base64 --decode DevxyzCrate-v04.b64 > DevxyzCrate-v04.zip
          mkdir -p source
          unzip -q DevxyzCrate-v04.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          unzip -t DevxyzCrate-v04.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk DevxyzCrate-v0.4-rebuild-debug.apk
          unzip -t DevxyzCrate-v0.4-rebuild-debug.apk
          sha256sum DevxyzCrate-v0.4-rebuild-debug.apk
          ls -lh DevxyzCrate-v0.4-rebuild-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzCrate-v0.4-rebuild-debug-apk
          path: DevxyzCrate-v0.4-rebuild-debug.apk
          if-no-files-found: error
