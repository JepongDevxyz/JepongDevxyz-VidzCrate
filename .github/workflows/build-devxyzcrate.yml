name: DevxyzCrate Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct v0.3 source
        shell: bash
        run: |
          cat .bootstrap_v03/chunk_*.b64 > DevxyzCrate-source.b64
          base64 --decode DevxyzCrate-source.b64 > DevxyzCrate-source.zip
          unzip -q DevxyzCrate-source.zip
          test -f DevxyzCrate/settings.gradle.kts
          test -f DevxyzCrate/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: DevxyzCrate
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s DevxyzCrate/app/build/outputs/apk/debug/app-debug.apk
          cp DevxyzCrate/app/build/outputs/apk/debug/app-debug.apk DevxyzCrate-v0.3-debug.apk
          ls -lh DevxyzCrate-v0.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzCrate-v0.3-debug-apk
          path: DevxyzCrate-v0.3-debug.apk
          if-no-files-found: error
