name: DevxyzCrate v0.8 Functional Editor APK

on:
  push:
    branches: [ rebuild/devxyzcrate-v08-functional ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reconstruct v0.5 source
        shell: bash
        run: |
          cat .bootstrap_v05/chunk_*.b64 > DevxyzCrate-v05.b64
          base64 --decode DevxyzCrate-v05.b64 > DevxyzCrate-v05.zip
          mkdir -p source
          unzip -q DevxyzCrate-v05.zip -d source
          unzip -t DevxyzCrate-v05.zip
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply v0.6 smooth UX patch
        shell: bash
        run: |
          python .v06_ux_patch.py
          grep -q 'versionName = "0.6.0"' source/app/build.gradle.kts

      - name: Apply v0.7 reference UI patch
        shell: bash
        run: |
          cat .v07_patch_chunks/chunk_*.b64 | base64 --decode | gzip -dc > /tmp/v07.patch
          patch -p1 -d source < /tmp/v07.patch
          grep -q 'versionName = "0.7.0"' source/app/build.gradle.kts

      - name: Apply v0.8 functional editor patch
        shell: bash
        run: |
          cat .v08_patch_chunks/chunk_*.b64 | base64 --decode | gzip -dc > /tmp/v08.patch
          patch -p1 -d source < /tmp/v08.patch
          grep -q 'versionName = "0.8.0"' source/app/build.gradle.kts
          grep -q 'GainProcessor' source/app/src/main/java/com/jepongdevxyz/vidcrate/media/Media3ExportEngine.kt
          grep -q 'beginClipDrag' source/app/src/main/java/com/jepongdevxyz/vidcrate/editor/EditorViewModel.kt
          grep -q 'VideoEffect.BLUR' source/app/src/main/java/com/jepongdevxyz/vidcrate/ui/EditorScreen.kt
          test -f source/CONCAT_FEATURE_NOTES.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk DevxyzCrate-v0.8-functional-debug.apk
          unzip -t DevxyzCrate-v0.8-functional-debug.apk
          sha256sum DevxyzCrate-v0.8-functional-debug.apk
          ls -lh DevxyzCrate-v0.8-functional-debug.apk

      - name: Package source
        shell: bash
        run: |
          cd source
          zip -qr ../DevxyzCrate-v0.8-functional-source.zip . -x ".gradle/*" "app/build/*" "build/*"
          cd ..
          unzip -t DevxyzCrate-v0.8-functional-source.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzCrate-v0.8-functional
          path: |
            DevxyzCrate-v0.8-functional-debug.apk
            DevxyzCrate-v0.8-functional-source.zip
          if-no-files-found: error
