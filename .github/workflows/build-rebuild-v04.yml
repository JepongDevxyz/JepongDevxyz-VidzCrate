name: DevxyzCrate Rebuild v0.4 APK

on:
  push:
    branches: [ "rebuild/devxyzcrate-v04" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4

      - name: Reconstruct v0.4 source
        shell: bash
        run: |
          cat .rebuild_v04/chunk_*.b64 > DevxyzCrate-rebuild-v0.4-source.b64
          base64 --decode DevxyzCrate-rebuild-v0.4-source.b64 > DevxyzCrate-rebuild-v0.4-source.zip
          unzip -o DevxyzCrate-rebuild-v0.4-source.zip || true
          test -d devxyzcrate_rebuild
          mv devxyzcrate_rebuild DevxyzCrate

          cp .rebuild_v04_patch/build.gradle.kts DevxyzCrate/app/build.gradle.kts
          cat .rebuild_v04_patch/EditorViewModel.part1 .rebuild_v04_patch/EditorViewModel.part2 >             DevxyzCrate/app/src/main/java/com/jepongdevxyz/vidcrate/editor/EditorViewModel.kt

          test -f DevxyzCrate/settings.gradle.kts
          test -f DevxyzCrate/app/build.gradle.kts
          test -f DevxyzCrate/app/src/main/java/com/jepongdevxyz/vidcrate/ui/EditorScreen.kt
          test -f DevxyzCrate/app/src/main/java/com/jepongdevxyz/vidcrate/editor/EditorViewModel.kt
          grep -q 'import androidx.compose.foundation.border' DevxyzCrate/app/src/main/java/com/jepongdevxyz/vidcrate/ui/HomeScreens.kt || sed -i '/import androidx.compose.foundation.background/a import androidx.compose.foundation.border' DevxyzCrate/app/src/main/java/com/jepongdevxyz/vidcrate/ui/HomeScreens.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: DevxyzCrate
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s DevxyzCrate/app/build/outputs/apk/debug/app-debug.apk
          unzip -t DevxyzCrate/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp DevxyzCrate/app/build/outputs/apk/debug/app-debug.apk DevxyzCrate-v0.4-rebuild-debug.apk
          ls -lh DevxyzCrate-v0.4-rebuild-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzCrate-v0.4-rebuild-debug-apk
          path: DevxyzCrate-v0.4-rebuild-debug.apk
          if-no-files-found: error
